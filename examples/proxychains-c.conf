# proxychains-ng 설정: vpn-c (127.0.0.1:1083)
#   brew install proxychains-ng
#   proxychains4 -f examples/proxychains-c.conf nmap -sT -Pn 10.0.0.10
# SOCKS 는 TCP 만 지나간다. nmap 은 -sT -Pn 으로 쓴다(SYN 스캔·ping 은 안 된다).
# macOS 는 시스템 기본 프로그램(/usr/bin 의 ssh, curl 등)에 proxychains 가 걸리지 않는다.
# 그런 프로그램은 자체 프록시 옵션이나 brew 로 설치한 것을 쓴다.

strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 127.0.0.1 1083
