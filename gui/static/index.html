<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpn-proxy</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>vpn-proxy</h1>
  <p class="sub">VPN 마다 로컬 SOCKS5 포트가 하나씩 있습니다. .ovpn 파일을 올려 VPN 을 추가하고, 켜고 끄고, 상태를 봅니다.</p>
</header>
<main>
  <p id="banner" class="banner" hidden></p>
  <p id="notice" class="notice" role="status" hidden></p>
  <section id="list" aria-live="polite"></section>
  <p id="empty" class="muted" hidden>등록된 VPN 이 없습니다.</p>
  <section class="card" aria-labelledby="add-title">
    <h2 id="add-title" class="name">VPN 추가</h2>
    <p class="aux">.ovpn 파일 하나를 올립니다(256KB 까지). 인증서·키는 ovpn 안에 &lt;ca&gt;·&lt;cert&gt;·&lt;key&gt; 블록으로 들어 있어야 합니다.</p>
    <div class="form">
      <label for="add-file">ovpn 파일</label>
      <input id="add-file" type="file" accept=".ovpn">
      <label for="add-name">이름</label>
      <input id="add-name" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="소문자·숫자·- (예: office)">
      <label for="add-user">아이디</label>
      <input id="add-user" type="text" maxlength="256" autocomplete="off" spellcheck="false" placeholder="ovpn 에 auth-user-pass 가 있을 때만">
      <label for="add-pass">비밀번호</label>
      <input id="add-pass" type="password" maxlength="256" autocomplete="off" placeholder="ovpn 에 auth-user-pass 가 있을 때만">
    </div>
    <p class="row"><button id="add-go" type="button">올리기</button></p>
    <p id="add-msg" class="msg" role="status" hidden></p>
    <ul id="add-reasons" class="reasons" hidden></ul>
  </section>
</main>
<footer class="muted">
  올린 ovpn 은 <code>ovpn/&lt;이름&gt;/</code> 폴더에 저장됩니다. 비밀번호와 키는 화면에 다시 나오지 않습니다.
  <span id="updated"></span>
</footer>
<script src="/app.js"></script>
</body>
</html>
