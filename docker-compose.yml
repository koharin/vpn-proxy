# VPN 하나 = 서비스 하나. Mac 에는 VPN 을 켜지 않고 로컬 포트로 VPN 을 고른다.
#
# 이 파일에는 VPN 이 적혀 있지 않다. VPN 은 웹 화면(python3 gui/server.py)에서 .ovpn 을 올리거나
# python3 gui/vpnctl.py import <이름> 으로 등록하고, 등록한 것은 compose.generated.yml 에 서비스로 생긴다
# (자동 생성, git 제외). 그래서 docker compose 는 언제나 두 파일을 함께 넘긴다:
#
#   docker compose -f docker-compose.yml -f compose.generated.yml ps
#
# (.env 에 COMPOSE_FILE=docker-compose.yml:compose.generated.yml 을 적어 두면 -f 없이 된다. .env.example 참고)
#
# 아래 vpn-template 은 모든 VPN 서비스가 따르는 틀이다. 프로필이 붙어 있어 저절로 뜨지 않는다.
# 여기를 고치면 gui/vpnstore.py 의 SERVICE_BASE 도 같게 고친다(tests/gui_test.py 가 둘을 비교한다).

services:
  vpn-template:
    profiles: ["template"]
    build: .
    image: vpn-proxy:local
    restart: unless-stopped
    cap_drop: [ALL]
    # NET_ADMIN: 터널·방화벽, SETUID/SETGID: SOCKS 서버가 nobody 로 권한을 낮춤.
    # NET_RAW 는 주지 않는다(컨테이너에서 임의 패킷을 만들 수 없게). ping 은 아래 sysctl 로 된다.
    cap_add: [NET_ADMIN, SETUID, SETGID]
    devices:
      - /dev/net/tun
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      # NET_RAW 없이 ping 을 쓰게 한다(ICMP echo 전용 소켓 허용).
      net.ipv4.ping_group_range: "0 2147483647"
    tmpfs:
      - /run
      - /tmp
    stop_grace_period: 5s
