# VPN 하나 = 서비스 하나. Mac 에는 VPN 을 켜지 않고 로컬 포트로 VPN 을 고른다.
#   127.0.0.1:1081 → vpn-a,  :1082 → vpn-b,  :1083 → vpn-c
#
# VPN 을 늘리려면 맨 아래 서비스 블록을 복사해 이름·폴더·포트만 바꾼다(README "VPN 추가").

x-vpn: &vpn
  build: .
  image: vpn-proxy:local
  restart: unless-stopped
  cap_drop: [ALL]
  # NET_ADMIN: 터널·방화벽, SETUID/SETGID: SOCKS 서버가 nobody 로 권한을 낮춤.
  # NET_RAW 는 주지 않는다(컨테이너에서 임의 패킷을 만들 수 없게). ping 은 아래 sysctl 로 된다.
  cap_add: [NET_ADMIN, SETUID, SETGID]
  devices:
    - /dev/net/tun
  security_opt:
    - no-new-privileges:true
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
    # NET_RAW 없이 ping 을 쓰게 한다(ICMP echo 전용 소켓 허용).
    net.ipv4.ping_group_range: "0 2147483647"
  tmpfs:
    - /run
    - /tmp
  stop_grace_period: 5s

services:
  vpn-a:
    <<: *vpn
    container_name: vpn-proxy-a
    environment:
      VPN_NAME: ${VPN_A_NAME:-vpn-a}
      VPN_AUTH_FILE: ${VPN_A_AUTH_FILE:-}
      VPN_DNS: ${VPN_A_DNS:-}
      VPN_CONNECT_TIMEOUT: ${VPN_CONNECT_TIMEOUT:-60}
    volumes:
      - ${VPN_A_DIR:-./ovpn/vpn-a}:/vpn:ro
    ports:
      - "127.0.0.1:${VPN_A_PORT:-1081}:1080"

  vpn-b:
    <<: *vpn
    container_name: vpn-proxy-b
    environment:
      VPN_NAME: ${VPN_B_NAME:-vpn-b}
      VPN_AUTH_FILE: ${VPN_B_AUTH_FILE:-}
      VPN_DNS: ${VPN_B_DNS:-}
      VPN_CONNECT_TIMEOUT: ${VPN_CONNECT_TIMEOUT:-60}
    volumes:
      - ${VPN_B_DIR:-./ovpn/vpn-b}:/vpn:ro
    ports:
      - "127.0.0.1:${VPN_B_PORT:-1082}:1080"

  vpn-c:
    <<: *vpn
    container_name: vpn-proxy-c
    environment:
      VPN_NAME: ${VPN_C_NAME:-vpn-c}
      VPN_AUTH_FILE: ${VPN_C_AUTH_FILE:-}
      VPN_DNS: ${VPN_C_DNS:-}
      VPN_CONNECT_TIMEOUT: ${VPN_CONNECT_TIMEOUT:-60}
    volumes:
      - ${VPN_C_DIR:-./ovpn/vpn-c}:/vpn:ro
    ports:
      - "127.0.0.1:${VPN_C_PORT:-1083}:1080"
